name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify tag matches project version
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match gradle.properties version ${VERSION}"
            echo "           Tag the release as v${VERSION}, or bump the version first."
            exit 1
          fi

      - name: Build distribution JARs (full + tiny + scripting)
        run: ./bundle.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: bundled/*.jar
