plugins {
    id 'java-library'
}

// Orchard: Scripting - JavaScript pack data support (.js files in packs).
//
// This module intentionally has NO Minecraft/loom/moddev toolchain: its own
// bytecode references only Orchard SPI types (which survive remapping) and
// Rhino (pure Java). It therefore compiles once against Orchard's compiled
// classes and produces one plain jar per loader, differing only by mod
// metadata. Rhino classes are merged straight into both output jars.

version = project.property('version')
group = project.property('group')

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of((project.property('java_version') as String).toInteger())
    }
}

// Resolved outside the dependencies block: inside it, project() creates a
// dependency notation instead of returning the Project.
def commonJarTask = project(':common').tasks.named('jar')

dependencies {
    // Orchard SPI (PackDataHandler, RawDefinition, ...) - provided by the base
    // mod at runtime, hence compile-only.
    compileOnly(files(commonJarTask))

    // Pure-Java JS engine; compiled against here and merged into both jars.
    implementation("org.mozilla:rhino:${rhino_version}")

    // Logging facade used by Orchard's Constants - provided at runtime.
    compileOnly('org.slf4j:slf4j-api:2.0.17')
}

def rhinoClasses = tasks.register('unpackRhino', Sync) {
    into(layout.buildDirectory.dir('rhino-classes'))
    from({
        configurations.runtimeClasspath.findAll { it.name.startsWith('rhino') }.collect { zipTree(it) }
    })
    exclude('module-info.class')
    exclude('META-INF/**')
}

tasks.register('fabricJar', Jar) {
    group = 'build'
    description = 'Orchard: Scripting for Fabric.'
    archiveBaseName = "orchard-scripting-fabric-${project.property('minecraft_version')}"
    from(sourceSets.main.output)
    from(rhinoClasses)
    from('src/fabricResources') {
        filesMatching('*.json') {
            expand([
                    'version'              : project.property('version'),
                    'minecraft_version'    : project.property('minecraft_version'),
                    'java_version'         : project.property('java_version'),
                    'fabric_loader_version': project.property('fabric_loader_version'),
                    'license'              : project.property('license'),
                    'mod_author'           : project.property('mod_author'),
            ])
        }
    }
    dependsOn(commonJarTask)
}

tasks.register('neoforgeJar', Jar) {
    group = 'build'
    description = 'Orchard: Scripting for NeoForge.'
    archiveBaseName = "orchard-scripting-neoforge-${project.property('minecraft_version')}"
    from(sourceSets.main.output)
    from(rhinoClasses)
    from('src/neoforgeResources') {
        filesMatching('**/*.toml') {
            expand([
                    'version'                : project.property('version'),
                    'minecraft_version_range': project.property('minecraft_version_range'),
                    'java_version'           : project.property('java_version'),
                    'license'                : project.property('license'),
                    'mod_author'             : project.property('mod_author'),
            ])
        }
    }
    dependsOn(commonJarTask)
}

// The plain `jar` task would produce a useless metadata-less archive;
// only the two loader-specific jars below are real artifacts.
tasks.named('jar') {
    enabled = false
}

// `./gradlew :scripting:build` should produce both loader jars.
tasks.named('assemble') {
    dependsOn(tasks.named('fabricJar'), tasks.named('neoforgeJar'))
}
